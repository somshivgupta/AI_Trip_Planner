[project]
name = "ai-trip-planner"
version = "0.1.0"
description = "AI-powered Trip Planner"
readme = "README.md"
authors = [
    { name = "somshivgupta", email = "somg0703@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain-ollama>=1.1.0",
]

[project.scripts]
ai-trip-planner = "ai_trip_planner:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"